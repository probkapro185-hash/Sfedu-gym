services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://sfedu:sfedu_secret@db:5432/sfedu_crm?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_long_random_string}
      JWT_TOKEN_TTL_HOURS: 24
      BCRYPT_COST: 12
      CORS_ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfedu -d sfedu_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
