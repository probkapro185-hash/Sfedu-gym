services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: 8080
      DATABASE_URL: postgres://postgres:1234@db:5432/postgres?sslmode=disable
      JWT_SECRET: change_me_in_production_use_long_random_string
      JWT_TOKEN_TTL_HOURS: 24
      BCRYPT_COST: 12
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      ADMIN_PASSWORD: '$$2a$$12$$obOWT7.qHQyoG2qLCUuvW.IybKvUfxobSFa3Ps2VdxtJIBJPmDVfy'
      REDIS_ADDR: redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: